services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Load the Gemini configuration. Hosted credentials are required at startup.
    env_file:
      - path: .env
        required: false
    volumes:
      # Persistence for SQLite / Chroma / claims (seeded from the image on first run).
      - backend_data:/app/data
      # The policy document resolves to /sample_policy.md (default POLICY_PATH is
      # "../sample_policy.md" relative to the backend package dir = /app).
      - ./sample_policy.md:/sample_policy.md:ro
    restart: unless-stopped

  # LiveKit real-time voice agent. Reuses the backend image and runs the agent
  # worker instead of the FastAPI server. It connects to a LiveKit server whose
  # credentials come from LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET
  # (see .env.example). STT/TTS need DEEPGRAM_API_KEY.
  voice-agent:
    build: ./backend
    command: python -m app.voice.livekit_agent
    env_file:
      - path: .env
        required: false
    depends_on:
      - backend
    volumes:
      # Share the same SQLite / Chroma / claims store as the backend so spoken
      # and typed turns resolve to the same conversations and history.
      - backend_data:/app/data
      - ./sample_policy.md:/sample_policy.md:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
